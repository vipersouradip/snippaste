name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build install package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\tools\build-site.ps1"

      - uses: softprops/action-gh-release@v2
        with:
          files: site/downloads/SnipPaste-windows.zip
          generate_release_notes: true